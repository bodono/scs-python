[build-system]
build-backend = 'mesonpy'
requires = [
  "numpy >= 2.0.0",
  "meson-python"
]

[project]
name = 'scs'
version = "3.3.0"
description = 'Splitting conic solver'
readme = 'README.md'
requires-python = '>=3.9'
classifiers = [
    'License :: OSI Approved :: MIT License',
    'Programming Language :: C',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: Free Threading :: 3 - Stable',
    'Programming Language :: Python :: Implementation :: CPython',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX',
    'Operating System :: Unix',
    'Operating System :: MacOS',
]
license = {file = 'LICENSE'}
authors = [
  {name = "Brendan O'Donoghue", email = "bodonoghue85@gmail.com"}]
dependencies = [
   'numpy',
   'scipy',
]

[project.optional-dependencies]
# MKL Pardiso backend for the pre-built Linux x86-64 wheels. The wheels link
# _scs_mkl against MKL but do not vendor it (MKL's dlopen'd CPU dispatch
# kernels are invisible to wheel-repair tools; see cvxgrp/scs#423): Intel's
# official wheels provide the complete library set at runtime. The version
# range must match the oneMKL generation the wheels are built against
# (currently the .so.3 ABI, oneMKL 2026); the clean-container CI smoke test
# enforces the pairing. Without this extra, AUTO falls back to QDLDL.
mkl = [
  'mkl >=2026, <2027 ; platform_system == "Linux" and platform_machine == "x86_64"',
  'intel-openmp >=2026, <2027 ; platform_system == "Linux" and platform_machine == "x86_64"',
]

[tool.cibuildwheel]
skip = [
  "*-win32", # fails on locating Python headers, probably meson.build is misconfigured
  "*musllinux*aarch64*" # no Scipy wheels for this
]
# Test
test-requires = "pytest"
test-command = "pytest {package}/test"
# we use the newer image for aarch64, for this there are openblas dev libraries
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.linux]
archs = [
  "x86_64",
  "aarch64",
  # "i686", # various issues, may work with some more testing
  # "s390x", # haven't tried it
  # "ppc64le", # haven't tried it
  # "armv7l", # haven't tried it
  ]

[tool.cibuildwheel.windows]
before-build = "pip install delvewheel"
# This will probably become default in newer cibuildwheels versions
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"

# Openblas installation for 3 different linux images

# x86_64 Linux: default backends (_scs_direct/_scs_indirect) link vendored
# OpenBLAS; _scs_mkl links MKL *without vendoring it* (mkl_backend mode).
# The 3.3.0 wheels vendored MKL and shipped it incomplete -- its dlopen'd
# CPU dispatch kernels are invisible to auditwheel, and every solve aborted
# on machines without MKL on the loader path (#423). At runtime MKL now
# comes from Intel's official wheels via the scs[mkl] extra instead.
#
# Two hard rules, both learned from #423:
#   1. No LD_LIBRARY_PATH in `environment`: the wheel tests must run exactly
#      as clean as a user's machine. The oneAPI paths are scoped to the
#      repair command only, where auditwheel needs to *find* the MKL libs it
#      is told to exclude.
#   2. upload_pypi is gated on the wheel_smoke_clean_env job, which installs
#      the wheel in a pristine container with and without scs[mkl].
[[tool.cibuildwheel.overrides]]
select = "*-manylinux_x86_64"
inherit.before-all = "append"
before-all = [
  "dnf install -y openblas-devel dnf-plugins-core",
  "dnf config-manager --add-repo https://yum.repos.intel.com/oneapi",
  "rpm --import https://yum.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB",
  "dnf install -y intel-oneapi-mkl-devel",
]
environment = {PKG_CONFIG_PATH = "/opt/intel/oneapi/mkl/latest/lib/pkgconfig:/opt/intel/oneapi/compiler/latest/lib/pkgconfig:$PKG_CONFIG_PATH"}
config-settings = {setup-args = "-Dmkl_backend=true"}
repair-wheel-command = "LD_LIBRARY_PATH='/opt/intel/oneapi/mkl/latest/lib:/opt/intel/oneapi/mkl/latest/lib/intel64:/opt/intel/oneapi/compiler/latest/lib' auditwheel repair --exclude 'libmkl_*' --exclude 'libiomp5*' -w {dest_dir} {wheel} && bash /project/.github/scripts/add_mkl_rpath.sh {dest_dir}"

[[tool.cibuildwheel.overrides]]
select = "*-manylinux_aarch64"
inherit.before-all = "append"
before-all = [
  # "dnf update", "dnf search blas",
  "dnf install -y openblas-devel"]

[[tool.cibuildwheel.overrides]]
select = "*-musllinux*"
inherit.before-all = "append"
before-all = [
  # "apk update", "apk search -v '*blas*'",
  "apk add openblas-dev"]

[tool.pytest.ini_options]
testpaths = [
    "test",
]
faulthandler_timeout = 600
faulthandler_exit_on_timeout = true
markers = [
    "thread_unsafe: mark test as unsafe to run in parallel threads (pytest-run-parallel)",
]
# pytest-run-parallel: functions that are not thread-safe
# (capsys/capfd are detected automatically by pytest-run-parallel)
thread_unsafe_functions = ["numpy.random.seed"]
