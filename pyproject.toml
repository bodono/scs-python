[build-system]
build-backend = 'mesonpy'
requires = [
  "numpy >= 2.0.0",
  "meson-python"
]

[project]
name = 'scs'
version = "3.3.1"
description = 'Splitting conic solver'
readme = 'README.md'
requires-python = '>=3.9'
classifiers = [
    'License :: OSI Approved :: MIT License',
    'Programming Language :: C',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: Free Threading :: 3 - Stable',
    'Programming Language :: Python :: Implementation :: CPython',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX',
    'Operating System :: Unix',
    'Operating System :: MacOS',
]
license = {file = 'LICENSE'}
authors = [
  {name = "Brendan O'Donoghue", email = "bodonoghue85@gmail.com"}]
dependencies = [
   'numpy',
   'scipy',
]

[tool.cibuildwheel]
skip = [
  "*-win32", # fails on locating Python headers, probably meson.build is misconfigured
  "*musllinux*aarch64*" # no Scipy wheels for this
]
# Test
test-requires = "pytest"
test-command = "pytest {package}/test"
# we use the newer image for aarch64, for this there are openblas dev libraries
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.linux]
archs = [
  "x86_64",
  "aarch64",
  # "i686", # various issues, may work with some more testing
  # "s390x", # haven't tried it
  # "ppc64le", # haven't tried it
  # "armv7l", # haven't tried it
  ]

[tool.cibuildwheel.windows]
before-build = "pip install delvewheel"
# This will probably become default in newer cibuildwheels versions
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"

# Openblas installation for 3 different linux images

# x86_64 Linux: the default backends link vendored OpenBLAS; _scs_mkl links
# MKL statically (Intel's mkl-static archives, sequential, symbols hidden) so
# the wheel is self-contained. The 3.3.0 wheels vendored dynamic MKL without
# its dlopen'd CPU dispatch kernels, which auditwheel cannot see, and every
# solve aborted on machines without MKL on the loader path (cvxgrp/scs#423).
# Hence: nothing in `environment` may point the loader at build-machine
# libraries, and publishing waits for wheel_smoke_clean_env (a pristine
# container solving with every backend) and wheel_audit.
[[tool.cibuildwheel.overrides]]
select = "*-manylinux_x86_64"
inherit.before-all = "append"
before-all = [
  "dnf install -y openblas-devel",
  "bash /project/.github/scripts/install_mkl_static.sh /opt/mkl-static",
]
config-settings = {setup-args = "-Dmkl_static_prefix=/opt/mkl-static"}

[[tool.cibuildwheel.overrides]]
select = "*-manylinux_aarch64"
inherit.before-all = "append"
before-all = [
  # "dnf update", "dnf search blas",
  "dnf install -y openblas-devel"]

[[tool.cibuildwheel.overrides]]
select = "*-musllinux*"
inherit.before-all = "append"
before-all = [
  # "apk update", "apk search -v '*blas*'",
  "apk add openblas-dev"]

[tool.pytest.ini_options]
testpaths = [
    "test",
]
faulthandler_timeout = 600
markers = [
    "thread_unsafe: mark test as unsafe to run in parallel threads (pytest-run-parallel)",
]
# pytest-run-parallel: functions that are not thread-safe
# (capsys/capfd are detected automatically by pytest-run-parallel)
thread_unsafe_functions = ["numpy.random.seed"]

# `--cov=scs` measures nothing when pytest runs from the repo root: the source
# directory `scs/` has no `__init__.py`, so coverage resolves the name to that
# namespace-package directory rather than to the installed `scs` package, and
# reports 0% with "No data was collected". `source_pkgs` states that `scs` is an
# importable package name, so coverage follows the import to site-packages.
[tool.coverage.run]
source_pkgs = ["scs"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.ruff]
extend-exclude = ["scs_source", "scs/pythoncapi-compat", "legacy_setup.py"]

[tool.ruff.lint]
# Pyflakes, the error subset of pycodestyle, and import sorting. Deliberately
# not ruff's rolling default set: that set grows with each release, so a ruff
# upgrade would turn into a CI failure unrelated to any change here.
select = ["E4", "E7", "E9", "F", "I"]
# `l` is the SCS cone key for the non-negative cone. It is the domain's name
# for that quantity, not a careless one-letter variable.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# The backend test modules import an extension solely to discover whether this
# build has it, inside a try/except that skips the module when it does not.
# The unused import *is* the test.
# I001 too: these modules' import order is left as the maintainers wrote it.
# `_scs_mkl` sets the MKL interface layer at import time, so import order
# around numpy/scipy carries meaning here that a sorter cannot see.
"test/*" = ["F401", "I001"]

[tool.mypy]
files = ["scs/py"]
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# scipy ships no inline types and its stub package is a separate, partial
# project; numpy's own stubs are used, so arrays are still checked.
module = ["scipy.*"]
ignore_missing_imports = true

[tool.interrogate]
fail-under = 100

[tool.deptry]
# `scs` is this project's own package: `scs/py/__init__.py` imports its
# compiled siblings via `from scs import _scs_direct`, which is not a
# third-party dependency.
known_first_party = ["scs"]
