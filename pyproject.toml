[build-system]
build-backend = 'mesonpy'
requires = [
  "numpy >= 2.0.0",
  "meson-python"
]

[project]
name = 'scs'
version = "3.3.1"
description = 'Splitting conic solver'
readme = 'README.md'
requires-python = '>=3.9'
classifiers = [
    'License :: OSI Approved :: MIT License',
    'Programming Language :: C',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: Free Threading :: 3 - Stable',
    'Programming Language :: Python :: Implementation :: CPython',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX',
    'Operating System :: Unix',
    'Operating System :: MacOS',
]
license = {file = 'LICENSE'}
authors = [
  {name = "Brendan O'Donoghue", email = "bodonoghue85@gmail.com"}]
dependencies = [
   'numpy',
   'scipy',
]

[tool.cibuildwheel]
skip = [
  "*-win32", # fails on locating Python headers, probably meson.build is misconfigured
  "*musllinux*aarch64*" # no Scipy wheels for this
]
# Test
test-requires = "pytest"
test-command = "pytest {package}/test"
# we use the newer image for aarch64, for this there are openblas dev libraries
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.linux]
archs = [
  "x86_64",
  "aarch64",
  # "i686", # various issues, may work with some more testing
  # "s390x", # haven't tried it
  # "ppc64le", # haven't tried it
  # "armv7l", # haven't tried it
  ]

[tool.cibuildwheel.windows]
before-build = "pip install delvewheel"
# This will probably become default in newer cibuildwheels versions
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"

# Openblas installation for 3 different linux images

# x86_64 Linux: the default backends link vendored OpenBLAS; _scs_mkl links
# MKL statically (Intel's mkl-static archives, sequential, symbols hidden) so
# the wheel is self-contained. The 3.3.0 wheels vendored dynamic MKL without
# its dlopen'd CPU dispatch kernels, which auditwheel cannot see, and every
# solve aborted on machines without MKL on the loader path (cvxgrp/scs#423).
# Hence: nothing in `environment` may point the loader at build-machine
# libraries, and publishing waits for wheel_smoke_clean_env (a pristine
# container solving with every backend) and wheel_audit.
[[tool.cibuildwheel.overrides]]
select = "*-manylinux_x86_64"
inherit.before-all = "append"
before-all = [
  "dnf install -y openblas-devel",
  "bash /project/.github/scripts/install_mkl_static.sh /opt/mkl-static",
]
config-settings = {setup-args = "-Dmkl_static_prefix=/opt/mkl-static"}

[[tool.cibuildwheel.overrides]]
select = "*-manylinux_aarch64"
inherit.before-all = "append"
before-all = [
  # "dnf update", "dnf search blas",
  "dnf install -y openblas-devel"]

[[tool.cibuildwheel.overrides]]
select = "*-musllinux*"
inherit.before-all = "append"
before-all = [
  # "apk update", "apk search -v '*blas*'",
  "apk add openblas-dev"]

[tool.pytest.ini_options]
testpaths = [
    "test",
]
faulthandler_timeout = 600
markers = [
    "thread_unsafe: mark test as unsafe to run in parallel threads (pytest-run-parallel)",
]
# pytest-run-parallel: functions that are not thread-safe
# (capsys/capfd are detected automatically by pytest-run-parallel)
thread_unsafe_functions = ["numpy.random.seed"]
